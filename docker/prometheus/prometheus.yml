global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    platform: fraud-detection
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
  - job_name: kafka
    static_configs:
      - targets: ['kafka1:9404', 'kafka2:9404', 'kafka3:9404']
  - job_name: schema-registry
    static_configs:
      - targets: ['schema-registry:8081']
    metrics_path: /metrics
  - job_name: spark
    static_configs:
      - targets: ['spark-master:8080', 'spark-worker-1:8081', 'spark-worker-2:8081']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
